name: toolbox-gateway

x-agent-env: &agent-env
  TOOLBOX_URL: http://toolbox:8000
  LLM_GATEWAY_URL: http://llm-gateway:8003
  GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-}
  MAX_TOOL_ROUNDS: ${MAX_TOOL_ROUNDS:-6}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-toolbox-gateway}

services:
  toolbox:
    build: ./toolbox
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  llm-gateway:
    build: ./llm-gateway
    ports:
      - "8003:8003"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.amazon.nova-pro-v1:0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-toolbox-gateway}
    restart: unless-stopped

  agent-http:
    build:
      context: ./agents
      dockerfile: agent-http/Dockerfile
    ports:
      - "8001:8000"
    environment:
      <<: *agent-env
    depends_on:
      toolbox:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    restart: unless-stopped

  agent-websocket:
    build:
      context: ./agents
      dockerfile: agent-websocket/Dockerfile
    ports:
      - "8002:8000"
    environment:
      <<: *agent-env
    depends_on:
      toolbox:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - agent-http
      - agent-websocket
    restart: unless-stopped
